name: Garmin Data Sync

concurrency:
  group: garmin-data-sync
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 22 * * *'  # 8 AM Australia/Brisbane (UTC+10)
    - cron: '0 23 * * *'  # 9 AM recovery run if the first run was flaky
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # needed to push updated charts back to the repo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Garmin token
        run: |
          mkdir -p ~/.garminconnect
          echo "${{ secrets.GARMIN_TOKENS }}" | base64 --decode > ~/.garminconnect/garmin_tokens.json
          chmod 600 ~/.garminconnect/garmin_tokens.json

      - name: Sync Garmin sleep and HRV → Google Sheets
        run: |
          for attempt in 1 2 3; do
            python collect.py && exit 0
            echo "Sleep/HRV sync attempt ${attempt} failed; retrying in 20 seconds..."
            sleep 20
          done
          exit 1
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}

      - name: Sync Garmin runs → Google Sheets
        run: |
          for attempt in 1 2 3; do
            python collect_runs.py && exit 0
            echo "Runs sync attempt ${attempt} failed; retrying in 20 seconds..."
            sleep 20
          done
          exit 1
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}

      - name: Sync Garmin run splits → Google Sheets
        run: |
          for attempt in 1 2 3; do
            python collect_run_details.py && exit 0
            echo "Run-splits sync attempt ${attempt} failed; retrying in 20 seconds..."
            sleep 20
          done
          exit 1
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}

      - name: Generate charts
        run: |
          for attempt in 1 2 3; do
            python garmin_sleep_consistency.py && exit 0
            echo "Chart generation attempt ${attempt} failed; retrying in 20 seconds..."
            sleep 20
          done
          exit 1
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}

      - name: Commit and push updated charts
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Update charts [skip ci]"
          git push

      - name: Recovery information
        if: failure()
        run: |
          echo "::error::Garmin sync failed after three in-job attempts."
          echo "The scheduled recovery run starts one hour later at 9 AM Australia/Brisbane."
          echo "If both runs fail, open this workflow run's logs and use Actions > Run workflow after fixing the reported cause."
